name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/drupal-files

            echo "🔐 Configuring Git safe directory..."
            git config --global --add safe.directory ${{ secrets.DEPLOY_PATH }}/drupal-files

            # Before the pull: a new index.php can need files that composer install generates.
            echo "🔧 Enabling maintenance mode..."
            docker exec -u www-data egam_drupal vendor/bin/drush state:set system.maintenance_mode 1
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            docker exec -u www-data egam_drupal composer install --optimize-autoloader
            
            echo "🗄️ Deploy..."
            docker exec -u www-data egam_drupal vendor/bin/drush deploy
            
            echo "🔓 Disabling maintenance mode..."
            docker exec -u www-data egam_drupal vendor/bin/drush state:set system.maintenance_mode 0
            
            echo "✅ Deployment completed!"
            docker exec -u www-data egam_drupal vendor/bin/drush status

      - name: 📧 Send notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
